<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Timesheet</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f9fafb;
      font-family: system-ui, -apple-system, sans-serif;
      color: #111827;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 360px;
    }
    .icon {
      font-size: 40px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 8px;
    }
    p {
      font-size: 14px;
      color: #6b7280;
      margin: 0;
    }
    button {
      margin-top: 20px;
      background: #16a34a;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⏱</div>
    <h1>You're offline</h1>
    <p>Timesheet needs a connection to load or sync your entries. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
